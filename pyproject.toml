[project]
name = "robinson"
version = "0.2.0"
description = "Offline German voice robot with servo eyes (Raspberry Pi 5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litert-lm>=0.18",
    "sherpa-onnx>=1.13",
    "sherpa-onnx-core>=1.13",                # native libs incl. libonnxruntime (not pulled on aarch64)
    "piper-tts>=1.8",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "livekit>=1.0",                          # WebRTC AEC (AudioProcessingModule)
    "adafruit-circuitpython-servokit>=1.3",
    "adafruit-blinka>=8.50",
    "rpi-lgpio>=0.6; platform_machine == 'aarch64'",  # RPi.GPIO shim for the Pi 5
    "mcp>=2.0",                              # tool server for the online (Claude Code) backend
]

[project.optional-dependencies]
whisper = ["pywhispercpp>=1.5"]

[project.scripts]
robinson = "robinson.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robinson"]

[tool.ruff]
line-length = 100
